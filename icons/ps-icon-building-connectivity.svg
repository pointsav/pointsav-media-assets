    <rect x="71" y="47" width="8" height="8"/>
    <rect x="41" y="61" width="8" height="8"/>
    <rect x="71" y="61" width="8" height="8"/>
  </g>
  <circle cx="60" cy="10" r="4" fill="#234ed8"/>
