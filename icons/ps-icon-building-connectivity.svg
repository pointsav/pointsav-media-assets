<svg class="class-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-label="Building Connectivity">
  <!-- Redrawn 2026-07-12 per ASSET-pointsav-icon-strip-redraw (project-marketing request):
       refined rather than redrawn from scratch, per the request's own instruction (this
       icon was already closest to the target style): converted the building from a
       white-fill/dark-stroke outline to a solid #231F20 silhouette with white window
       cutouts (matching Woodfine's dark-fill/light-cutout convention), removed the
       stroke outline, kept the antenna/signal-wave motif and the two side connectivity
       nodes (repositioned for the new square viewBox), consistent #234ed8 blue accent,
       consistent crop weight with the other 2 redrawn PointSav icons.
       Baked-in caption text removed 2026-07-12 (follow-up request): the consuming
       icon_strip() component renders a real, visible h3 title alongside a decorative
       (alt="") image, so a caption baked into the SVG duplicated that visible text. -->
  <rect x="34" y="26" width="52" height="54" fill="#231F20"/>
  <rect x="52" y="66" width="16" height="14" fill="#FFFFFF"/>
  <g fill="#FFFFFF">
    <rect x="41" y="33" width="8" height="8"/>
    <rect x="56" y="33" width="8" height="8"/>
    <rect x="71" y="33" width="8" height="8"/>
