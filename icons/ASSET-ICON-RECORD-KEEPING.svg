<svg class="class-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-label="Record Keeping">
  <!-- Redrawn 2026-07-12 per ASSET-pointsav-icon-strip-redraw (project-marketing request):
       replaces the grey isometric archive-box illustration with a solid-silhouette
       front-view archive box, matching Woodfine's 4-icon family style: solid #231F20
       fill, no isometric perspective, one consistent #234ed8 blue accent (filing tab),
       square viewBox with consistent crop weight across all 3 PointSav icons.
       Baked-in caption text removed 2026-07-12 (follow-up request): the consuming
       icon_strip() component renders a real, visible h3 title alongside a decorative
       (alt="") image, so a caption baked into the SVG duplicated that visible text. -->
